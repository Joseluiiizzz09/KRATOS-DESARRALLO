# /etc/nginx/sites-available/kratos   ->   ln -s a /etc/nginx/sites-enabled/kratos
#
# Variante sin dominio: KRATOS en http://IP:8081 (puerto propio, no toca lo que ya sirve PRIZMA).
# Con dominio: cambiar "listen 8081;" por "listen 80;" y poner  server_name tu-dominio.com;
# y luego  sudo certbot --nginx -d tu-dominio.com  para activar HTTPS.

server {
    listen 8081;
    server_name _;

    root /var/www/kratos/frontend/dist;
    index index.html;

    # Fotos y audios de las ventas pueden ser pesados
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API de KRATOS (todos los modulos) y archivos protegidos, hacia el backend interno
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Archivos estaticos con nombre unico: cache larga
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplicacion de una sola pagina: cualquier ruta (/login, /asesor/...) devuelve index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
